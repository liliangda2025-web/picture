server:
  port: 9421
  servlet:
    context-path: /api
spring:
  application:
    name: picture-backend

  #数据库配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/picture
    username: root
    password: 1234
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: false
    #将sql日志输出至控制台，仅在开发环境使用
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: isDelete
      logic-delete-value: 1
      logic-not-delete-value: 0

#knife4j配置
knife4j:
    enable: true
    openapi:
      title: "接口文档"
      version: 1.0
      group:
        default:
          api-rule: package
          api-rule-resources:
            - org.example.picturebackend.controller

